# De runner die elke repo van de vloot aanraakt, houdt zich aan wat de vloot van elke repo
# vraagt: een remote, tests, en een rechter die niet op de machine van de dader draait.
#
# Dat het er niet was, kostte twee keer hetzelfde: een fout in het bestandenplan en een
# afgebroken run door een ontbrekende lockfile, allebei pas zichtbaar in de CI van een
# klantproject nadat een hand er al mee gedraaid had.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: node --test "test/*.test.mjs"

      # De workflow zelf is het andere halve product, en hij draait alleen op een echte
      # runner. Wat hier wél te toetsen valt: dat hij leesbaar is en de invoer nog heet
      # zoals Elixir hem stuurt. Een hernoemde invoer breekt anders elk project tegelijk.
      - name: De workflow leest, en zijn invoer heet nog zoals Elixir hem stuurt
        run: |
          python3 - <<'PY'
          import yaml
          wf = yaml.safe_load(open('.github/workflows/fix.yml'))
          on = wf.get('on') or wf.get(True)
          inputs = on['workflow_call']['inputs']
          for name in ('plan', 'evidence', 'capability', 'php-version', 'node-version', 'install', 'prepare', 'test', 'build', 'env', 'mysql', 'schema'):
              assert name in inputs, f'de invoer {name} is weg, en elk project dat hem meegeeft breekt'
          print(f'{len(inputs)} invoerwaarden, en alle twaalf die de vloot meegeeft staan er')

          # De rechter moet zich laten aanwijzen. De uitslag draagt sinds 14 september 2026
          # wat er getest is (`judge`), en de hand mag pas beweren dat de tests groen stonden
          # als dat er staat. Verdwijnt een van deze twee ids, dan leest de bewaarstap een
          # lege uitkomst en zwijgt het voorstel over de tests - stil, en dus erger dan rood.
          steps = wf['jobs']['fix']['steps']
          ids = {s.get('name'): s.get('id') for s in steps}
          assert ids.get('Tests vooraf') == 'baseline', 'de nulmeting heeft geen id baseline meer'
          assert ids.get('Tests achteraf') == 'judge', 'de test achteraf heeft geen id judge meer'
          bewaren = next(s for s in steps if s.get('name') == 'Uitslag bewaren')
          for naam in ('BASELINE', 'JUDGE', 'TEST'):
              assert naam in (bewaren.get('env') or {}), f'{naam} bereikt de uitslag niet meer'
          assert 'u.judge' in bewaren['run'], 'de uitslag draagt de rechter niet meer'
          print('de rechter staat in de uitslag, met de twee uitkomsten waar de hand op steunt')
          PY
